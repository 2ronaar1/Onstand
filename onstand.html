<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03060C"><title>Onstand</title>
<style>
/* ===== Onstand · Grundstil und Rahmen (Konzept D) ===== */
:root{color-scheme:dark;--j:#FF9E4A;--d:#B8622E;--aj:#FF9E4A;--ad:#B8622E;--bg:#03060C;--txt:#fff;--sub:#9AABBB;--row:#c8d6e8;--rot:#FF4D6D;--gelb:#FFC857;--gruen:#7FD68A;--blau:#8FB8FF;--ok:#7FD68A;--warn:#FFC857;--bad:#FF4D6D;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--seite:232px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--aj);outline-offset:2px}
/* Rahmen: der frühere Arbeitsmodus-Einschub wird zur ganzen Fläche */
#am.onstand{position:fixed;inset:0;z-index:5;pointer-events:auto}
#am.onstand .amlade{position:absolute;inset:0;width:auto;transform:none;border-left:0;display:flex;background:linear-gradient(180deg,#05080f,#020409)}
#am .onseite{width:var(--seite);flex:none;display:flex;flex-direction:column;gap:18px;padding:calc(18px + var(--st)) 12px calc(14px + var(--sb));border-right:1px solid color-mix(in srgb,var(--aj) 18%,transparent);background:#04070d;z-index:3}
#am .onlogo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;border-radius:12px;text-align:left;min-width:0}
#am .onlogo .av,#am .onmenu .av{width:40px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--aj) 55%,transparent);display:grid;place-items:center;font-size:13px;letter-spacing:1px;color:var(--aj);background:color-mix(in srgb,var(--aj) 8%,#05090f);flex:none;overflow:hidden}
#am .onlogo .av img,#am .onmenu .av img{width:100%;height:100%;object-fit:contain}
#am .onlogo:hover .av{box-shadow:0 0 12px color-mix(in srgb,var(--aj) 40%,transparent)}
#am .onlogo .ln{min-width:0}
#am .onlogo b{display:block;font-size:11px;letter-spacing:2px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#am .onlogo small{display:block;font-size:9px;color:var(--sub);letter-spacing:1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#am .onnav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none}
#am .onni{position:relative;display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:11px;padding:10px 10px;font-size:10px;letter-spacing:1.6px;color:var(--sub);text-align:left;transition:background .2s,color .2s;width:100%}
#am .onni svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#am .onni:hover{color:#fff;background:rgba(154,171,187,.06)}
#am .onni.an{color:var(--aj);background:color-mix(in srgb,var(--aj) 10%,transparent)}
#am .onni em{margin-left:auto;font-style:normal;font-size:9px;background:var(--rot);color:#fff;border-radius:8px;padding:1px 6px;letter-spacing:0}
#am .onunten{margin-top:auto}
#am.onstand .aminhalt{flex:1;min-width:0;padding:calc(24px + var(--st)) 64px calc(16px + var(--sb)) 30px;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
#am.onstand .aminhalt.raus{opacity:0;transform:translateY(6px)}
/* Griff rechts: Assistent */
.ongriff{position:absolute;right:0;top:50%;transform:translateY(-50%);width:30px;height:160px;border-radius:14px 0 0 14px;border:1px solid color-mix(in srgb,var(--aj) 45%,transparent);border-right:0;background:color-mix(in srgb,var(--aj) 8%,#05090f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:15;font-size:8.5px;letter-spacing:2.5px;color:var(--aj);transition:background .2s,width .2s}
#am .ongriff span{writing-mode:vertical-rl}
#am .ongriff svg{width:16px;height:16px;fill:none;stroke:var(--aj);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#am .ongriff:hover{background:color-mix(in srgb,var(--aj) 16%,#05090f);width:34px}
#am .ongriff.punkt:after{content:'';position:absolute;top:10px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--rot);box-shadow:0 0 8px var(--rot);animation:onpuls 2s ease-in-out infinite}
@keyframes onpuls{50%{opacity:.35}}
#am .ondimm{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#am .oneinschub{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:25;border-left:1px solid color-mix(in srgb,var(--aj) 35%,transparent);box-shadow:-30px 0 60px #000a;background:radial-gradient(ellipse at 50% 0%,#120b05,#04070d 55%);display:flex;flex-direction:column}
#am.asan .oneinschub{transform:none}
#am.asan .ondimm{opacity:1;pointer-events:auto}
/* Assistent innen */
.asschl{position:absolute;top:calc(12px + var(--st));right:12px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(154,171,187,.3);background:#05090f;color:var(--sub);font-size:16px;line-height:1;z-index:2}
#am .asx{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding-bottom:8px}
#am .asgruss{padding:calc(20px + var(--st)) 56px 6px 20px}
#am .asgruss h3{margin:0;font-size:21px;font-weight:400;letter-spacing:.3px}
#am .asgruss small{display:block;font-size:10px;color:var(--sub);margin-top:5px;letter-spacing:1.5px}
#am .astk{display:flex;flex-direction:column;gap:8px;padding:12px 20px}
#am .astk>div{display:flex;align-items:center;gap:10px;border:1px solid rgba(154,171,187,.16);border-radius:14px;padding:10px 12px;background:#070b13;font-size:12px;color:var(--row);line-height:1.45;animation:asrein .4s cubic-bezier(.2,.8,.2,1) both}
#am .astk>div:nth-child(2){animation-delay:.06s}#am .astk>div:nth-child(3){animation-delay:.12s}
#am .astk>div.eins{border-color:color-mix(in srgb,var(--aj) 30%,rgba(154,171,187,.16))}
#am .astk>div i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
#am .astk>div span{flex:1}#am .astk>div b{color:#fff;font-weight:400}
#am .astk>div button{font-size:9px;letter-spacing:1.2px;border:1px solid var(--aj);background:none;color:var(--aj);border-radius:10px;padding:6px 8px;white-space:nowrap}
#am .asleer{font-size:12px;color:var(--sub);padding:6px 2px}
#am .asleer.ruhig{border:1px dashed rgba(154,171,187,.2);border-radius:14px;padding:12px;text-align:center}
#am .asmehr{align-self:flex-start;background:none;border:0;color:var(--aj);font-size:10px;letter-spacing:1.5px;padding:2px}
#am .aserz{margin:6px 20px 4px;display:flex;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--aj) 50%,transparent);border-radius:20px;padding:12px 14px;background:color-mix(in srgb,var(--aj) 7%,#05090f);cursor:pointer;transition:background .2s,border-color .2s}
#am .aserz:hover{background:color-mix(in srgb,var(--aj) 12%,#05090f)}
#am .aserz b{display:block;font-size:13px;font-weight:400;color:#fff}
#am .aserz small{display:block;font-size:10.5px;color:var(--sub);margin-top:2px;line-height:1.45}
#am .aserz>div{flex:1;min-width:0}
#am .asmic{width:46px;height:46px;border-radius:50%;background:var(--aj);display:grid;place-items:center;flex:none}
#am .asmic svg{width:22px;height:22px;fill:none;stroke:#160a02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#am .aserz.hoert{border-color:var(--rot);background:color-mix(in srgb,var(--rot) 8%,#05090f)}
#am .aserz.hoert .asmic{background:var(--rot);animation:asmp 1.2s ease-out infinite}
#am .aserz.hoert .asmic svg{stroke:#fff}
#am .aserz.hoert small{color:#fff;font-size:12px}
@keyframes asmp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rot) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
#am .asfertig{font-size:9px;letter-spacing:1.3px;border:1px solid #fff;background:none;color:#fff;border-radius:10px;padding:7px 9px}
#am .asfluss{display:flex;flex-direction:column;gap:10px;padding:10px 20px}
#am .asb{align-self:flex-start;max-width:94%;font-size:12.5px;line-height:1.5;color:var(--row);border:1px solid rgba(154,171,187,.18);border-radius:16px 16px 16px 4px;padding:9px 12px;background:#070b13;animation:asrein .35s cubic-bezier(.2,.8,.2,1)}
#am .asb b{color:#fff;font-weight:400}
#am .asb.du{align-self:flex-end;border-radius:16px 16px 4px 16px;background:#0b1424;color:#fff}
#am .askn{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
#am .askn button{font-size:9px;letter-spacing:1.2px;border:1px solid rgba(154,171,187,.3);background:#05090f;color:var(--row);border-radius:10px;padding:6px 9px}
#am .askn button.ja{background:var(--aj);border-color:var(--aj);color:#160a02}
#am .askarte{border:1px solid color-mix(in srgb,var(--aj) 35%,transparent);border-radius:16px;background:#070b13;padding:12px 14px;animation:asrein .4s cubic-bezier(.2,.8,.2,1)}
#am .askarte.ok{border-color:color-mix(in srgb,var(--gruen) 35%,transparent)}
#am .askk{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--aj);margin-bottom:8px}
#am .askk span{color:var(--gruen);letter-spacing:1px}
#am .asmit{margin:0 0 8px;font-size:11px;color:var(--sub);font-style:italic;line-height:1.45}
#am .asfelder{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px}
#am .asfelder span{font-size:8.5px;letter-spacing:1.3px;color:var(--sub)}
#am .asfelder b{font-weight:400;color:#fff}
#am .asfelder input{width:100%;background:#03070e;border:1px solid rgba(154,171,187,.18);border-radius:8px;color:#fff;font:12px Arial;padding:6px 8px;color-scheme:dark}
#am .asfelder input:placeholder-shown{border-style:dashed}
#am .asbst{display:flex;gap:5px;flex-wrap:wrap}
#am .asbst button{font-size:9.5px;letter-spacing:1px;border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);background:none;color:var(--row);border-radius:9px;padding:5px 8px}
#am .asbst button.an{background:color-mix(in srgb,var(--cc) 25%,transparent);color:#fff;border-color:var(--cc)}
#am .asbst em{font-size:11px;color:var(--sub)}
#am .asunten{padding:10px 16px calc(14px + var(--sb));border-top:1px solid rgba(154,171,187,.08)}
#am .asvor{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
#am .asvor button{font-size:10px;color:var(--row);background:none;border:1px solid rgba(154,171,187,.22);border-radius:12px;padding:6px 10px}
#am .asvor button:hover{border-color:var(--aj);color:#fff}
#am .aseing{display:flex;gap:8px}
#am .aseing input{flex:1;min-width:0;background:#03070e;border:1px solid rgba(154,171,187,.25);border-radius:22px;color:#fff;font:12.5px Arial;padding:11px 14px}
#am .aseing button{width:42px;border-radius:50%;border:0;background:var(--aj);color:#160a02;font-size:14px}
@keyframes asrein{from{opacity:0;transform:translateY(6px)}}
/* Menü am Firmenlogo */
.onmenu{position:absolute;left:12px;top:calc(70px + var(--st));z-index:40;width:260px;background:#08101c;border:1px solid color-mix(in srgb,var(--aj) 35%,transparent);border-radius:14px;padding:8px;box-shadow:0 18px 40px #000a;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
#am .onmenu.an{opacity:1;transform:none;pointer-events:auto}
#am .onmenu .mk{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid rgba(154,171,187,.12);margin-bottom:6px}
#am .onmenu .mk b{display:block;font-size:12px;font-weight:400}#am .onmenu .mk small{font-size:10px;color:var(--sub)}
#am .onmenu button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--row);text-align:left}
#am .onmenu button:hover{background:rgba(154,171,187,.08);color:#fff}
#am .onmenu button small{color:var(--sub);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
#am .onmenu hr{border:0;border-top:1px solid rgba(154,171,187,.12);margin:6px 0}
/* Meldung und Dialog */
.ontoast{position:absolute;left:50%;bottom:calc(26px + var(--sb));transform:translate(-50%,16px);background:#0b1220;border:1px solid var(--aj);color:#fff;font-size:12px;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:45;max-width:min(520px,90%);text-align:center;line-height:1.45}
#am .ontoast.an{opacity:1;transform:translate(-50%,0)}
#am .ondlg{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
#am .ondlg.an{opacity:1;pointer-events:auto}
#am .ondk{width:min(440px,100%);background:#08101c;border:1px solid color-mix(in srgb,var(--aj) 35%,transparent);border-radius:16px;padding:18px;transform:translateY(8px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#am .ondlg.an .ondk{transform:none}
#am .ondk h3{margin:0 0 10px;font-size:12px;letter-spacing:3px;color:var(--aj);font-weight:400}
#am .ondk p{font-size:12.5px;color:var(--row);line-height:1.55;margin:0 0 10px}#am .ondk p b{color:#fff;font-weight:400}#am .ondk .kl{font-size:11px;color:var(--sub)}
#am .ondk label{display:flex;flex-direction:column;gap:6px;font-size:8.5px;letter-spacing:1.5px;color:var(--sub);margin-bottom:10px}
#am .ondk input{background:#03070e;border:1px solid rgba(154,171,187,.25);border-radius:10px;color:#fff;font:13px Arial;padding:10px 11px}
#am .ondkn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
#am .ondkn button{font-size:9.5px;letter-spacing:1.5px;border:1px solid rgba(154,171,187,.3);background:#05090f;color:var(--row);border-radius:14px;padding:9px 12px}
#am .ondkn button.ja{background:var(--aj);border-color:var(--aj);color:#160a02}
/* Start-Bildschirm */
#onstart{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:radial-gradient(ellipse at 50% 30%,#140c05,#020409 70%);padding:16px;overflow:auto}
#onstart.an{display:grid}
.osk{width:min(440px,100%);text-align:center;animation:asrein .6s cubic-bezier(.2,.8,.2,1)}
.osl{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--aj) 60%,transparent);display:grid;place-items:center;box-shadow:0 0 40px color-mix(in srgb,var(--aj) 25%,transparent)}
.osl span{width:22px;height:22px;border-radius:50%;background:var(--aj);box-shadow:0 0 18px var(--aj)}
.osk h1{margin:0;font-size:30px;letter-spacing:10px;font-weight:400;text-shadow:0 0 18px color-mix(in srgb,var(--aj) 50%,transparent)}
.osk .osu{color:var(--aj);font-size:11px;letter-spacing:3px;margin:8px 0 22px}
.osk p{font-size:13px;color:var(--row);line-height:1.6}.osk p b{color:#fff;font-weight:400}
.osk label{display:flex;flex-direction:column;gap:6px;font-size:8.5px;letter-spacing:1.5px;color:var(--sub);text-align:left;margin:10px 0}
.osk input{background:#03070e;border:1px solid rgba(154,171,187,.25);border-radius:10px;color:#fff;font:13px Arial;padding:11px 12px}
.osb{margin-top:14px;font-size:10.5px;letter-spacing:2px;background:var(--aj);border:0;color:#160a02;border-radius:16px;padding:13px 22px}
.osk .osh{font-size:11px;color:var(--sub);margin-top:18px}
/* Kalender öffnet sich rechts neben der Navigation; sein runder Iris-Knopf wird nicht gebraucht */
#kal{left:var(--seite)!important;z-index:9;background:linear-gradient(180deg,#05080f,#020409)}
#kalbtn,#kiris,#kal .kiris{display:none!important}
#pk{z-index:60}
/* ---------- Handy ---------- */
@media (max-width:760px){
 :root{--seite:62px}
 #am .onseite{padding:calc(14px + var(--st)) 7px calc(10px + var(--sb));gap:12px;align-items:center}
 #am .onlogo .ln,#am .onni span{display:none}
 #am .onlogo .av{width:38px;height:38px}
 #am .onni{justify-content:center;padding:10px 6px}
 #am .onni em{position:absolute;top:3px;right:3px;margin:0;padding:0 4px;font-size:8px}
 #am.onstand .aminhalt{padding:calc(18px + var(--st)) 16px calc(12px + var(--sb)) 14px}
 #am .ongriff{width:20px;height:110px;font-size:0;gap:0}
 #am .ongriff span{display:none}
 #am .ongriff svg{width:13px;height:13px}

 #am .onmenu{left:8px;top:calc(60px + var(--st))}
}
@media (prefers-reduced-motion:reduce){#am.onstand *,#onstart *{animation:none!important;transition:none!important}}

#am .amberuf{display:none}
/* ---------- Firmenkonto & Abgleich ---------- */

#am .onsy i{width:9px;height:9px;border-radius:50%;background:var(--gruen,#7FD68A);box-shadow:0 0 0 2px #05090f,0 0 8px currentColor;color:var(--gruen,#7FD68A)}

/* ===== Papierkorb & Sicherung (v15.16) ===== */
#pk{position:fixed;inset:0;z-index:60;pointer-events:none;--aj:#FF9E4A;--sub:#9AABBB;--row:#c8d6e8;--rot:#FF4D6D;--gelb:#FFC857}
#pk .pkin{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px)) 20px;box-sizing:border-box;background:linear-gradient(180deg,#05080f,#020409);border-left:1px solid color-mix(in srgb,var(--aj) 30%,transparent);transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:auto;font-family:Arial,Helvetica,sans-serif;color:#fff}
#pk.auf .pkin{transform:none}
#pk .pkkopf{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:3px;color:var(--aj)}
#pk .pkzu{width:34px;height:34px;border-radius:50%;border:1px solid rgba(154,171,187,.3);background:#05090f;color:var(--sub);font-size:18px;line-height:1;cursor:pointer}
#pk .pktabs{display:flex;gap:6px;border-bottom:1px solid rgba(154,171,187,.14)}
#pk .pktabs button{font-size:10px;letter-spacing:2px;color:var(--sub);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 9px;display:flex;gap:6px;align-items:center;cursor:pointer}
#pk .pktabs button.an{color:#fff;border-color:var(--aj)}
#pk .pktabs em{font-style:normal;font-size:9px;color:var(--sub);background:rgba(154,171,187,.12);border-radius:8px;padding:1px 6px}
#pk .pkx{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
#pk .pkx>*{flex-shrink:0}
#pk .pkx.raus{opacity:0;transform:translateY(8px)}
#pk .pksuche{width:100%;box-sizing:border-box;background:#03070e;border:1px solid rgba(154,171,187,.25);border-radius:10px;color:#fff;font:12px Arial;padding:9px 10px}
#pk .pkl{display:flex;flex-direction:column;gap:8px}
#pk .pki{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:#060b14;border:1px solid rgba(154,171,187,.16);border-radius:14px;padding:10px 12px;max-height:160px;overflow:hidden;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1),max-height .45s,padding .45s,margin .45s}
#pk .pki.raus{opacity:0;transform:translateX(-30px);max-height:0;padding-top:0;padding-bottom:0;margin-top:-8px;border-width:0}
#pk .pki.zurueck{opacity:0;transform:translateY(-24px) scale(.95);max-height:0;padding-top:0;padding-bottom:0;margin-top:-8px;border-width:0}
#pk .pkic{width:36px;height:36px;border-radius:50%;border:1px solid color-mix(in srgb,var(--aj) 40%,transparent);display:grid;place-items:center}
#pk .pkic svg{width:17px;height:17px;fill:none;stroke:var(--aj);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pk .pki b{display:block;font-size:12.5px;font-weight:400}
#pk .pki small{display:block;font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.4}
#pk .pktg{display:block;font-size:8.5px;letter-spacing:1.2px;margin-top:5px;color:var(--sub)}
#pk .pktg i{display:inline-block;height:3px;width:60px;border-radius:2px;background:rgba(154,171,187,.15);vertical-align:2px;margin-left:6px;position:relative;overflow:hidden}
#pk .pktg i:after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--sub)}
#pk .pktg.knapp{color:var(--gelb)}#pk .pktg.knapp i:after{background:var(--gelb)}
#pk .pkak{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#pk .pkak button,#pk .pkkn button,#pk .pkleeren,#pk .sidf button{font-size:9px;letter-spacing:1.3px;border:1px solid rgba(154,171,187,.3);background:#05090f;color:var(--row);border-radius:12px;padding:7px 10px;white-space:nowrap;cursor:pointer}

#pk button:disabled{opacity:.55;cursor:default}

#pk .pkhin b{color:var(--row);font-weight:400}
#pk .pkkarte{background:#060b14;border:1px solid rgba(154,171,187,.16);border-radius:16px;padding:14px}
#pk .pkgr{display:block;font-size:9.5px;letter-spacing:2.5px;color:var(--sub);font-weight:400;margin-bottom:10px}

#pk .sizp b{display:block;font-size:12px;font-weight:400}

async function datei(pfad){let h=ROOT;if(pfad.startsWith('@/')){h=GED;pfad=pfad.slice(2)}const teile=pfad.split('/');for(const t of teile.slice(0,-1))h=await h.getDirectoryHandle(t);return h.getFileHandle(teile.at(-1),{create:false})}

async function fsDir(pfad,create){let h=ROOT;if(pfad.startsWith('@/')){h=GED;pfad=pfad.slice(2)}for(const t of pfad.split('/').filter(Boolean))h=await h.getDirectoryHandle(t,{create:!!create});return h}

const ohneLinks=x=>String(x).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');

const kopfMeta=(typ,h,q,si)=>`---\ntyp: ${typ}\nquelle: ${q}\nsicherheit: ${si}\nstand: ${HEUTE()}\ntags: [onstand, ${typ}]\n---\n`;
async function gedBereichLink(H,bereich,name){const p=`@/${H}/${bereich}/${bereich}.md`;let b=await lesen(p);if(!b)b=kopfMeta('bereich','','Onstand','hoch')+`# ${bereich}\n\nTeil von [[${H}]].\n`;

async function gedNotiz(h,bereich,name,zeile,o={}){const H='Persönlich';name=notizName(name);if(!name||!(await gedOk()))return false;
 const pfad=`@/${H}/${bereich}/${name}.md`;let alt=await lesen(pfad);const kern=zeile.split(' · Quelle:')[0];
 try{if(alt){if(alt.includes(kern))return true;await schreiben(pfad,alt.replace(/^stand: .*$/m,'stand: '+HEUTE()).replace(/\s*$/,'\n')+'- '+zeile+'\n');return true}
  await schreiben(pfad,kopfMeta(o.typ||'notiz','',o.quelle||'Onstand',o.sicherheit||'hoch')+`# ${name}\n\n${o.intro||'Teil von [['+bereich+']].'}\n\n- ${zeile}\n`);await gedBereichLink(H,bereich,name);return true}catch(e){return false}}

async function handyGed(){const db=await new Promise((res,rej)=>{const r=indexedDB.open('onstand-daten',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const tx=(f)=>new Promise((res,rej)=>{const t=db.transaction('f','readwrite');f(t.objectStore('f'));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});

 const alsDatei=t=>t instanceof Blob?t:new Blob([t||''],{type:'text/plain'});
 class FH{constructor(n,p,t){this.kind='file';this.name=n;this.p=p;this.t=t}async getFile(){const b=alsDatei(this.t);return Object.assign(b,{name:this.name,lastModified:this.m||0})}
  async createWritable(){const s=this,teile=[];return {write:async d=>{teile.push(d&&d.data!==undefined?d.data:d)},close:async()=>{const txt=teile.every(x=>typeof x==='string');s.t=txt?teile.join(''):new Blob(teile);s.m=Date.now();await tx(st=>st.put(s.t,s.p))}}}}
 class DH{constructor(n,p){this.kind='directory';this.name=n;this.p=p;this.c=new Map()}async queryPermission(){return 'granted'}async requestPermission(){return 'granted'}
  async getDirectoryHandle(n,o={}){let h=this.c.get(n);if(!h){if(!o.create)throw new DOMException('nicht vorhanden','NotFoundError');h=new DH(n,this.p+n+'/');this.c.set(n,h)}if(h.kind!=='directory')throw new DOMException('kein Ordner','TypeMismatchError');return h}
  async getFileHandle(n,o={}){let h=this.c.get(n);if(!h){if(!o.create)throw new DOMException('nicht vorhanden','NotFoundError');h=new FH(n,this.p+n,'');this.c.set(n,h)}if(h.kind!=='file')throw new DOMException('keine Datei','TypeMismatchError');return h}
  async removeEntry(n){const h=this.c.get(n);if(!h)return;this.c.delete(n);await tx(st=>{if(h.kind==='file')st.delete(h.p);else st.delete(IDBKeyRange.bound(h.p,h.p+'￿'))})}
  async *entries(){for(const e of [...this.c])yield e}async *values(){for(const h of [...this.c.values()])yield h}async *keys(){for(const k of [...this.c.keys()])yield k}}
 const root=new DH('Daten','');for(const [p,t] of Object.entries(alle)){const parts=p.split('/');let d=root;for(const x of parts.slice(0,-1)){if(!d.c.get(x))d.c.set(x,new DH(x,d.p+x+'/'));d=d.c.get(x)}d.c.set(parts.at(-1),new FH(parts.at(-1),p,t))}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);

		var modPoly = rawPoly.mod(rsPoly);

            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {

	}

		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function asTag(s){const d=new Date();if(/\bvorgestern\b/i.test(s))d.setDate(d.getDate()-2);else if(/\bgestern\b/i.test(s))d.setDate(d.getDate()-1);
 else{const wt=['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'],m=s.toLowerCase().match(/\b(?:am|letzten)\s+(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/);if(m){const z=wt.indexOf(m[1]);do d.setDate(d.getDate()-1);while(d.getDay()!==z)}

function asBaustelle(s){const l=' '+s.toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ')+' ',L=Object.values(BST).filter(b=>b.status!=='abgeschlossen').concat(Object.values(BST).filter(b=>b.status==='abgeschlossen'));

 for(const t of teile){const sauber=t.replace(raus,' ').replace(/\b\d{1,2}([:.]\d\d)?\b/g,' ').replace(/\s+/g,' ').trim();if(sauber.length<3)continue;

async function asBefehl(t,vomKnopf,gesprochen){await asLaden();const s=t.toLowerCase(),b=asBaustelle(asZahlen(t));if(!vomKnopf)AS.fluss.push({typ:'du',t});AS.scrollUnten=true;

function asTermin(text){const s=asZahlen(String(text||'')),l=s.toLowerCase(),d=new Date();d.setHours(12,0,0,0);let tag=null,roh=[];
